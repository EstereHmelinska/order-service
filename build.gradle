plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-web
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-validation
    implementation 'org.springframework.boot:spring-boot-starter-validation:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-data-jpa
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:4.0.0")

    // Source: https://mvnrepository.com/artifact/org.projectlombok/lombok
    compileOnly("org.projectlombok:lombok:1.18.48")

    annotationProcessor 'org.projectlombok:lombok:1.18.48'
    testCompileOnly 'org.projectlombok:lombok:1.18.48'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

    // Source: https://mvnrepository.com/artifact/com.mysql/mysql-connector-j
    implementation("com.mysql:mysql-connector-j:9.5.0")

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-webmvc-test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test:4.0.0'

}

test {
    useJUnitPlatform()
}