plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-web
    implementation 'org.springframework.boot:spring-boot-starter-web:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-kafka
    implementation 'org.springframework.boot:spring-boot-starter-kafka:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-test
    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.0.0'

    // Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-webmvc-test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test:4.0.0'
}

test {
    useJUnitPlatform()
}